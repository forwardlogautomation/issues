<head>

<title>Issues · Issue Log · Forwardlog</title>

<style>:root{--brand:#5F7A61;--brand-dk:#475C4A;--brand-lt:#E9F0E9;--brand-ink:#fff;--bg:#F3F5F2;--card:#fff;--ink:#262A27;--grey:#6B6B6B;--muted:#7A807B;--line:#E2E7E2;--ok:#2E7D4F;--ok-bg:#E2F3E8;--bad:#C0392B;--bad-bg:#FBE4E1;--warn:#B7791F;--warn-bg:#FDF1DC;--info:#2A5D9F;--info-bg:#E7F1FB;--radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(40,60,45,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--brand);padding:8px 12px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
header.top .logo{height:58px;width:auto;margin:-4px auto -4px 0;display:block;min-width:60px}
header.top .logo[src=""]{visibility:hidden}
header.top .htitle{order:3;flex:1 0 100%;display:flex;align-items:baseline;gap:8px;padding:5px 2px 0;border-top:1px solid var(--line)}
header.top .app{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--brand);text-transform:uppercase}
header.top h1{font-size:15px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
header.top .hlink{font-size:13px;font-weight:700;color:var(--brand-dk);text-decoration:none;padding:4px 2px}
header.top button{background:var(--brand-lt);color:var(--brand-dk);border:0;border-radius:10px;padding:7px 11px;font-weight:700;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
#acct{display:flex;align-items:center;gap:8px}
#acct .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
#acct .who{line-height:1.15;text-align:right}#acct .who b{display:block;font-size:12.5px}#acct .who span{display:block;font-size:11px;color:var(--muted)} #acct button{margin-left:2px} header.top .htitle{min-height:33px;box-sizing:border-box} header.top .htitle .app{line-height:14.5px} header.top .htitle h1{line-height:21.75px} header.top .htitle .hlink{align-self:center} #n_client,#n_solution,#f_client,#f_solution{text-transform:uppercase} .solpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 6px} .solbox{display:flex;align-items:center;gap:8px;margin:0;padding:9px 10px;border:1.5px solid #CBD3CB;border-radius:11px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;background:#fff} .solbox input{width:auto;margin:0;padding:0;accent-color:var(--brand)} .solbox:has(input:checked){border-color:var(--brand);background:var(--brand-lt)} .solother{text-transform:uppercase} @media (max-width:560px){header.top .logo{height:46px;margin:-2px auto -2px 0}}
@media (max-width:640px){#acct .who{display:none}}
main{max-width:900px;margin:0 auto;padding:14px 12px 120px}
footer.tag{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.4px;padding:4px 0 22px}footer.tag b{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.8px;color:var(--grey);font-weight:700}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid #CBD3CB;border-radius:11px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(95,122,97,.22)}
input[type=checkbox],input[type=radio]{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:12px 16px;min-height:44px;font:inherit;font-size:15px;font-weight:700;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.97);filter:brightness(.93)}.btn.sec{background:#EDF1ED;color:var(--ink)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sm{padding:8px 12px;font-size:13px;min-height:36px}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1 1 150px}.muted{color:var(--muted);font-size:12.5px}.hidden{display:none!important}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:999px;background:#ECEFEC;color:#4B524C;text-transform:uppercase;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.brand{background:var(--brand-lt);color:var(--brand-dk)}.chip.info{background:var(--info-bg);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stat{background:#F7F9F7;border:1.5px solid var(--line);border-radius:12px;padding:9px 2px 8px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}.stat span{display:block;line-height:1.2;margin-top:3px;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.2px}
.stat.on{border-color:var(--brand);background:var(--brand-lt)}
.stat.me b{color:var(--ok)}.stat.sales b{color:var(--warn)}.stat.client b{color:var(--info)}
.toolbar{display:flex;gap:8px;margin:12px 0 10px;flex-wrap:wrap;align-items:center}.toolbar input[type=search]{flex:2 1 160px;min-width:0}.toolbar select{flex:1 1 130px;min-width:0}
.toggle{display:flex;flex:1 0 100%;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--grey);margin:0}
.list{list-style:none;margin:0;padding:0}
.list li.pj{background:#fff;border:1px solid var(--line);border-left:5px solid #CBD3CB;border-radius:12px;padding:12px 10px 12px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;box-shadow:var(--shadow)}
.list li.pj.w-me{border-left-color:var(--ok)}.list li.pj.w-sales{border-left-color:#E0A33A}.list li.pj.w-client{border-left-color:#4F8AD1}.list li.pj.w-hold{border-left-color:#9AA19B;background:#FAFBFA}
.pj .main{flex:1;min-width:0}.pj .t1{font-size:15px}.pj .t1 b{font-weight:700}.pj .clock{font-size:12px;color:var(--grey);margin-top:6px}.pj .na{font-size:13px;color:var(--ink);margin-top:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
details.done{margin-top:14px}details.done summary{cursor:pointer;font-weight:700;color:var(--grey);padding:10px 4px;font-size:13px}
.stagebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stagebar button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 1px;font:inherit;font-size:9.5px;font-weight:700;color:var(--grey);cursor:pointer;line-height:1.2;min-height:60px;min-width:0;overflow-wrap:anywhere}
.stagebar button b{display:block;font-size:15px;color:var(--ink)}
.stagebar button.on{background:var(--brand);border-color:var(--brand);color:#fff}.stagebar button.on b{color:#fff}
@media (max-width:480px){.stagebar{grid-template-columns:repeat(3,minmax(0,1fr))}.stagebar button{font-size:11px;min-height:58px}}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;font:inherit;font-size:13px;font-weight:700;color:var(--grey);cursor:pointer;min-height:44px}
.seg button.on{background:var(--brand-lt);border-color:var(--brand);color:var(--brand-dk)}
dl.facts{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;margin:0}dl.facts dt{font-size:12px;font-weight:600;color:var(--muted)}dl.facts dd{margin:0;word-break:break-word}
@media (max-width:480px){dl.facts{grid-template-columns:1fr}dl.facts dt{margin-top:6px}}
.tl{list-style:none;margin:0;padding:0}.tl li{border-left:3px solid var(--line);padding:2px 0 14px 12px;margin-left:5px;position:relative}
.tl li:before{content:"";position:absolute;left:-8px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--brand)}
.tl li.undone{opacity:.5}.tl .d{font-size:12px;color:var(--muted)}.tl .n{margin-top:2px;white-space:pre-wrap;word-break:break-word}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px max(12px, calc((100% - 900px) / 2 + 12px)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:25}
.actionbar .btn{flex:1;padding:12px 8px}
.fab{position:fixed;right:max(14px, calc((100% - 900px) / 2 + 14px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:24;box-shadow:0 6px 18px rgba(40,60,45,.35);border-radius:999px;padding:14px 20px}
.overlay{position:fixed;inset:0;background:rgba(20,28,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 4px;font-size:17px}.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:6px}
.sheet .btns{display:flex;gap:8px;margin-top:16px}.sheet .btns .btn{flex:1}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}.chipsel button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--grey);cursor:pointer;min-height:40px}
.chipsel button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.hint{background:var(--info-bg);color:var(--info);border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:90vw}
.toast.err{background:var(--bad)}
#wall{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#wall .box{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px 22px;max-width:380px;width:100%;text-align:center}
#wall img{height:64px;margin-bottom:6px}#wall h2{font-size:17px;margin:6px 0 4px}#wall p{color:var(--muted);font-size:13px;margin:0 0 16px}
#wall #gbtn{display:flex;justify-content:center;min-height:44px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:700;white-space:nowrap}
table select,table input[type=date]{font-size:14px;padding:7px 8px;min-width:130px}
.tablewrap table{min-width:1020px}
td select[data-k=stage]{min-width:180px}
tr.check td{background:var(--warn-bg)}
@media print{header.top button,.noprint{display:none!important}body{background:#fff}.card{border:0;box-shadow:none}}
header.top .logolink{display:block;flex:0 0 auto;margin-right:auto;line-height:0;cursor:pointer;border-radius:6px}header.top .logolink .logo{margin-left:0;margin-right:0}header.top .logolink:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* Forwardlog company style (forwardlog-company-style): off-white page, Forwardlog green, Montserrat, caps green titles with a left bar,
   white cards with a green top edge, no gradients, footer tag "Endless Flexibility In Automation". */
:root{--fl:#5F7A61;--fl-dk:#3E5240;--char:#2E3A33;--off:#FBFBF9;--panel:#E9EFE7;--band:#EEF2EC;--edge:#D9E0D6;--mute:#6B7A6C}
html,body{background:var(--off);color:var(--char)}
header.top{background:#fff;border-bottom:3px solid var(--fl);box-shadow:none}
main.hub{max-width:1080px;margin:0 auto;padding:22px 16px 30px}
.tb{display:flex;gap:14px;align-items:stretch;margin:6px 0 20px}
.tb .bar{width:8px;border-radius:2px;background:var(--fl);flex:0 0 auto}
.tb .eb{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.tb h1{margin:2px 0 4px;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--fl)}
.tb p{margin:0;color:var(--mute);font-size:14px}

/* ===== Issue Log page ===== */
main.iss{max-width:1180px;margin:0 auto;padding:18px 14px 120px}
.tb{display:flex;gap:14px;align-items:stretch;margin:4px 0 16px}
.tb .bar{width:8px;border-radius:2px;background:var(--fl);flex:0 0 auto}
.tb .eb{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mute)}
.tb h2{margin:2px 0 4px;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--fl)}
.tb h2 span{display:block;font-size:15px;letter-spacing:1px;color:var(--fl-dk);font-weight:700;margin-top:2px}
.tb p{margin:0;color:var(--mute);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1.5px solid var(--edge);border-top:6px solid var(--fl);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s}
.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.kpi span{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.kpi.open{border-top-color:#B4532A}.kpi.open b{color:#B4532A}.kpi.closed b{color:var(--ok)}
.kpi.on{border-color:var(--fl);background:var(--panel)}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(40,60,45,.12)}
.clients{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.clients button{border:1.5px solid var(--edge);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--char);cursor:pointer}
.clients button small{font-weight:500;color:var(--mute);margin-left:6px;font-size:11.5px}
.clients button.on{background:var(--fl);border-color:var(--fl);color:#fff}.clients button.on small{color:#E4ECE4}
.filters{background:#fff;border:1px solid var(--edge);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:2 1 200px;min-width:0;padding:9px 12px}
.filters select{flex:1 1 150px;min-width:0;padding:9px 10px}
.fseg{display:inline-flex;border:1.5px solid var(--edge);border-radius:10px;overflow:hidden;flex:0 0 auto}
.fseg button{border:0;background:#fff;padding:8px 11px;font:inherit;font-size:13px;font-weight:700;color:var(--grey);cursor:pointer}
.fseg button+button{border-left:1.5px solid var(--edge)}
.fseg button.on{background:var(--panel);color:var(--fl-dk)}
.flbl{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin-right:4px}
.fg{display:flex;align-items:center;gap:4px}
.exbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.exbar .cnt{margin-left:auto;font-size:12.5px;color:var(--mute)}
.exbar .btn.sm{min-height:38px}
.grp{margin:16px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-left:6px solid var(--fl);border-radius:4px 10px 10px 4px}
.grp b{font-size:15px;color:var(--fl-dk)}.grp span{font-size:12.5px;color:var(--mute)}
.grp .gc{margin-left:auto;font-size:12px;font-weight:700;color:var(--fl-dk)}
.issue{background:#fff;border:1px solid var(--edge);border-left:5px solid #B4532A;border-radius:12px;padding:12px 12px 10px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.issue.closed{border-left-color:var(--ok)}
.issue:hover{box-shadow:0 6px 16px rgba(40,60,45,.10)}
.issue:focus-visible{outline:3px solid rgba(95,122,97,.35);outline-offset:2px}
.issue.out{opacity:.45}
.issue .pk{flex:0 0 auto;padding-top:2px}.issue .pk input{width:18px;height:18px;accent-color:var(--fl);cursor:pointer}
.issue .bd{flex:1;min-width:0}
.issue .h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
.issue .no{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:500;font-size:13px;color:var(--char)}
.issue .dt{font-size:12px;color:var(--mute);margin-left:auto}
.st{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.st.OPEN{background:#F9ECE7;color:#B4532A}.st.CLOSED{background:var(--ok-bg);color:var(--ok)}
.cat{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--panel);color:var(--fl-dk)}
.flds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld .k{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.fld .v{font-size:13.5px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.fld .v.cn{color:#4E5A51}
.fld .v+.v{margin-top:4px;padding-top:4px;border-top:1px dashed var(--band)}
@media (max-width:760px){.flds{grid-template-columns:1fr}.tb h2{font-size:21px}.kpi b{font-size:22px}}
.lang-en .cn,.lang-cn .en{display:none!important}
.sheet.ed{max-width:820px}
.ed .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.ed .g2,.ed .g4{grid-template-columns:1fr}}
.ed .ph{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--fl-dk);margin:14px 0 -4px;padding-top:10px;border-top:1px solid var(--band)}
.ed .note{font-size:12.5px;color:var(--mute);background:var(--panel);border-radius:10px;padding:8px 10px;margin-top:10px}
.ed .del{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--bad)}
.drivenote{font-size:12.5px;color:var(--mute);margin:14px 0 0}.drivenote a{color:var(--fl-dk);font-weight:700}
#pdfsheet{position:fixed;left:-10000px;top:0;width:1500px;background:#fff;color:#2E3A33;font-family:Montserrat,sans-serif;padding:28px;box-sizing:border-box}
#pdfsheet .t{display:flex;gap:12px;align-items:center;margin-bottom:6px}
#pdfsheet .t img{height:46px}
#pdfsheet h3{margin:0;font-size:22px;color:#5F7A61;text-transform:uppercase;letter-spacing:.5px}
#pdfsheet .meta{font-size:12px;color:#6B7A6C;margin:0 0 12px}
#pdfsheet table{border-collapse:collapse;width:100%;font-size:12px;min-width:0}
#pdfsheet th{background:#5F7A61;color:#fff;text-align:left;padding:6px 7px;border:1px solid #bfbfbf;font-size:11px;text-transform:none;letter-spacing:0;font-weight:700}
#pdfsheet td{border:1px solid #bfbfbf;padding:6px 7px;vertical-align:top;white-space:pre-wrap}
#pdfsheet tbody tr:nth-child(even) td{background:#EEF2EC}
#pdfsheet td.o{background:#F9ECE7!important}#pdfsheet td.c{background:#E2F3E8!important}

function cellVal(it, k, lang) {
  if (k === 'cat') return lang === 'en' ? it.cat_en : lang === 'cn' ? (it.cat_cn || CAT_CN[it.cat_en] || it.cat_en) : [it.cat_en, it.cat_cn || CAT_CN[it.cat_en]].filter(Boolean).join('\n');
  if (k === 'status') return lang === 'en' ? it.status : lang === 'cn' ? ST_CN[it.status] : it.status + '\n' + (ST_CN[it.status] || '');
  if (k === 'project') return lang === 'en' ? it.project : lang === 'cn' ? (it.project_cn || it.project) : [it.project, it.project_cn].filter(Boolean).join('\n');

}
function buildXlsx(groups, lang) {
  return loadLib('xlsx').then(function () {
    var wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('Issues', { views: [{ state: 'frozen', ySplit: 1 }] }), cols = exportCols(lang);
    ws.columns = cols.map(function (c) { return { header: c.h, key: c.k, width: c.w }; });
    var line = { style: 'thin', color: { argb: 'FFBFBFBF' } }, border = { top: line, left: line, bottom: line, right: line }, font = { name: 'Montserrat', size: 10 };
    ws.getRow(1).height = 22;
    ws.getRow(1).eachCell(function (c) { c.font = { name: 'Montserrat', bold: true, color: { argb: 'FFFFFFFF' } }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF5F7A61' } }; c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; c.border = border; });
    var r = 2, si = cols.findIndex(function (c) { return c.k === 'status'; }) + 1;
    groups.forEach(function (g) {
      var start = r;
      g.rows.forEach(function (it, n) {
        var row = ws.getRow(r);
        cols.forEach(function (c, i) {
          var cell = row.getCell(i + 1); cell.value = cellVal(it, c.k, lang) || null; cell.font = font; cell.alignment = { vertical: 'top', wrapText: true }; cell.border = border;
          if (n % 2) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF2EC' } };
        });
        var sc = row.getCell(si); sc.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: it.status === 'CLOSED' ? 'FFE2F3E8' : 'FFF9ECE7' } }; sc.alignment = { horizontal: 'center', vertical: 'top', wrapText: true };
        r++;

      [1, 2].forEach(function (ci) {
        if (r - 1 > start) ws.mergeCells(start, ci, r - 1, ci);
        var c = ws.getCell(start, ci); c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; c.font = { name: 'Montserrat', bold: true, size: 10 }; c.border = border;
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE9EFE7' } };

    });

  });
}
function stamp() { return today(); }
function filterLabel() {
  var p = []; if (S.clients.size) p.push(Array.from(S.clients).join(', ')); if (S.status !== 'ALL') p.push(S.status === 'OPEN' ? 'Open' : 'Closed'); if (S.cat) p.push(S.cat);
  return p.length ? p.join(' - ') : 'All';
}
function download(name, blob) {
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportXlsx() {
  var g = exportGroups(); if (!g.length) { toast('Nothing to export with these filters.', true); return; }
  var b = $('#bXlsx'); b.classList.add('fl-busy');
  buildXlsx(g, S.lang).then(function (buf) { download('Project Issues (' + filterLabel() + ') ' + stamp() + '.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); })
    .catch(fail).then(function () { b.classList.remove('fl-busy'); });
}
function buildPdfSheet(groups, lang) {
  var s = $('#pdfsheet'), cols = exportCols(lang), total = groups.reduce(function (a, g) { return a + g.rows.length; }, 0);
  var h = '<div class="t"><img src="/logo.png" alt=""><h3>Project issues &amp; action plan · 项目问题与行动计划</h3></div>' +
    '<div class="meta">Filter: ' + esc(filterLabel()) + ' · ' + total + ' items · exported ' + esc(fmtDate(new Date().toISOString())) + '</div>' +
    '<table><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c.h) + '</th>'; }).join('') + '</tr></thead><tbody>';
  groups.forEach(function (g) {
    g.rows.forEach(function (it, i) {
      h += '<tr>' + cols.map(function (c) {
        if (c.k === 'client' || c.k === 'project') return i ? '' : '<td class="g" rowspan="' + g.rows.length + '">' + esc(cellVal(it, c.k, lang)) + '</td>';
        return '<td' + (c.k === 'status' ? ' class="' + (it.status === 'CLOSED' ? 'c' : 'o') + '"' : '') + '>' + esc(cellVal(it, c.k, lang)) + '</td>';
      }).join('') + '</tr>';
    });
  });
  s.innerHTML = h + '</tbody></table><div class="ft"><i></i><b>Endless Flexibility In Automation</b></div>';

}
function exportPdf() {
  var groups = exportGroups(); if (!groups.length) { toast('Nothing to export with these filters.', true); return; }
  var b = $('#bPdf'); b.classList.add('fl-busy', 'fl-light');
  Promise.all([loadLib('h2c'), loadLib('pdf')]).then(function () {
    var s = buildPdfSheet(groups, S.lang);
    return Promise.all([document.fonts ? document.fonts.ready : 0, new Promise(function (r) { var im = s.querySelector('img'); if (im.complete) r(); else { im.onload = im.onerror = r; } })]).then(function () {
      var scale = 2;
      return html2canvas(s, { scale: scale, backgroundColor: '#ffffff', windowWidth: 1500 }).then(function (canvas) {
        var pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
        var pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 24, ratio = (pw - 2 * m) / canvas.width, pageH = Math.floor((ph - 2 * m) / ratio);
        var top = s.getBoundingClientRect().top;
        var breaks = $$('tbody tr', s).map(function (tr) { return Math.round((tr.getBoundingClientRect().top - top) * scale); }); breaks.push(canvas.height);
        var y = 0, first = true;
        while (y < canvas.height - 2) {                         // break only between rows, never through one
          var end = y + pageH;
          if (end < canvas.height) { var cand = breaks.filter(function (x) { return x > y + 40 && x <= end; }); if (cand.length) end = cand[cand.length - 1]; } else end = canvas.height;
          var part = document.createElement('canvas'); part.width = canvas.width; part.height = end - y;
          part.getContext('2d').drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
          if (!first) pdf.addPage(); first = false;
          pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, canvas.width * ratio, (end - y) * ratio);
          y = end;
        }
        download('Project Issues (' + filterLabel() + ') ' + stamp() + '.pdf', pdf.output('blob'));
      });
    });
  }).catch(fail).then(function () { b.classList.remove('fl-busy', 'fl-light'); $('#pdfsheet').innerHTML = ''; });
}
function b64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function saveDrive() {
  var all = clientList().map(function (c) { return Object.assign({}, c, { rows: c.items.slice().sort(sortItems) }); });
  if (!all.length) { toast('Nothing to save yet.', true); return; }
  var title = 'Project Issues & Action Plan (' + fmtDate(new Date().toISOString()) + ')';
  buildXlsx(all, 'both').then(function (buf) { return api('saveToDrive', [b64(buf), title]); })
    .then(function (meta) { S.d.drive = meta; cacheSet('boot', S.d); renderDriveNote(); toast('Saved to Google Drive. The folder now holds the latest copy.'); })
    .catch(fail);
}

/* ---------- start ---------- */
function goHome() { S.status = 'OPEN'; S.clients.clear(); S.cat = ''; S.q = ''; if (/^#(i=|new)/.test(location.hash)) goList(); render(); }
function run(cachedOnly) {
  var c = cacheGet('boot'); if (c && !S.d) { S.d = c; render(); route(); }

/* other people's changes: quiet refresh every 2 minutes while the page is open, and when you come back to it */
function quietRefresh() {
  if (document.hidden || S.editor || !S.d || /PASTE/.test(API_URL)) return;
